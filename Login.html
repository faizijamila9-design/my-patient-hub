<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<!--Welcome Section-->
<section class="welcome-section">
    <h1>Welcome to My PatientHUB!</h1>
    <p>We provide smart healthcare services in your hands.</p>

</section>
<!--Sign In Form-->
<section class="login-box">
    <h2> Sign in to My PatientHUB</h2>
    <!--Social Login-->
    <div class="social-login">
        <button type="button">
            <img src="images/google.png"
            alt="Google">
        </button>
        <button type="button">
        <img src="images/facebook.png"
        alt="Facebook">
        </button>
    </div>
    <!--Login Form-->
    <Form>
        <input type="text" placeholder="Email or Phone number">
        <input type="password" placeholder="Please Enter Your Password">
        <button type="submit">SIGN IN</button>
        <!--Forgot Password and Remeber Me-->
        <div class="login-options">
            <a href="#">Forgot password?</a>
            <label>
                <input type="checkbox">
                Remember me
            </label>
        </div>
        <!--OR-->
        <div class="or">
            <span>or</span>
        </div>
        <!--Sign UP-->
        <button type="button">SIGN UP</button>
    </Form>
</section>
<!--Footer-->
<footer>
    <a href="#">Google Play Store APP</a>
    <a href="#">App Store App</a>
    <a href="#">About MyPatientHUB</a>
    <a href="#">About Us</a>
    <a href="#">Our Blog</a>
</footer>
<body>
    
</body>
</html>
